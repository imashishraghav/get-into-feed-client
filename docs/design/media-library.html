<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Library — GetIntoFeed Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #F4F6F9;
      --bg-card: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-hover: #F8FAFC;
      --bg-selected: #EEF3FE;
      --border: #E2E6EC;
      --border-strong: #CBD5E1;
      --text-primary: #0F172A;
      --text-secondary: #566074;
      --text-muted: #64748B;
      --blue: #2250E8;
      --blue-hover: #1B42C4;
      --blue-soft: #EEF3FE;
      --red: #DC2626;
      --red-hover: #FEF2F2;
      --amber-bg: #FEF3C7;
      --amber-text: #92400E;
      --amber-border: #FCD34D;
      --lime: #A3E635;
      --focus-ring: 0 0 0 3px rgba(34, 80, 232, 0.24);
      --radius-card: 16px;
      --radius-control: 10px;
      --radius-thumb: 8px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select {
      font-family: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .btn:focus-visible,
    .input:focus-visible,
    .select:focus-visible,
    .icon-btn:focus-visible,
    .nav-item:focus-visible,
    .folder-btn:focus-visible,
    .page-btn:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
      border-color: var(--blue);
    }

    /* App Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Slim Icon Sidebar */
    .sidebar {
      width: 68px;
      flex-shrink: 0;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 24px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #0F172A;
      color: var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.02em;
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      align-items: center;
    }

    .nav-item {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background-color 0.15s, color 0.15s;
    }

    .nav-item:hover {
      background: var(--bg-page);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
    }

    /* Main Column */
    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .topbar {
      height: 64px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .breadcrumb-current {
      color: var(--text-primary);
      font-weight: 600;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: #0F172A;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.02em;
      border: 1px solid var(--border);
    }

    /* Page Container */
    .page-content {
      max-width: 1372px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 32px 48px;
    }

    /* Page Header */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .page-title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .page-subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Buttons */
    .btn {
      height: 40px;
      padding: 0 16px;
      border-radius: var(--radius-control);
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:hover:not(:disabled) {
      background: var(--bg-subtle);
      border-color: var(--border-strong);
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--blue-hover);
      border-color: var(--blue-hover);
    }

    .btn-danger-text {
      color: var(--red);
    }

    .btn-danger-text:hover:not(:disabled) {
      background: var(--red-hover);
      border-color: #FECACA;
    }

    .btn-ghost {
      border-color: transparent;
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover:not(:disabled) {
      background: var(--bg-page);
      color: var(--text-primary);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Main White Card */
    .media-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      overflow: hidden;
    }

    /* Upload Dropzone Drawer (inside card top when active) */
    .upload-panel {
      padding: 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
      display: none;
    }

    .upload-panel.open {
      display: block;
    }

    .upload-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .upload-panel-title {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      color: var(--text-primary);
    }

    .dropzone {
      border: 2px dashed var(--border-strong);
      border-radius: 12px;
      background: var(--bg-card);
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--blue);
      background: var(--blue-soft);
    }

    .dropzone-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 12px;
      border-radius: 10px;
      background: var(--bg-page);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dropzone-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin: 0 0 4px;
    }

    .dropzone-hint {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
    }

    .upload-queue {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upload-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .upload-item-info {
      flex: 1;
      min-width: 0;
    }

    .upload-item-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .upload-progress-track {
      height: 6px;
      border-radius: 999px;
      background: var(--bg-page);
      overflow: hidden;
    }

    .upload-progress-bar {
      height: 100%;
      background: var(--blue);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* Card Body Layout: Folders Panel + Main Content */
    .card-workspace {
      display: flex;
      min-height: 520px;
    }

    .folders-panel {
      width: 224px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      background: var(--bg-card);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .folders-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 8px;
    }

    .folders-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .folder-add-link {
      background: none;
      border: none;
      color: var(--blue);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }

    .folder-add-link:hover {
      background: var(--blue-soft);
    }

    .folder-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
    }

    .folder-btn:hover {
      background: var(--bg-page);
    }

    .folder-btn.active {
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 600;
    }

    .folder-btn.nested {
      padding-left: 28px;
      font-size: 13px;
    }

    .folder-btn-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .folder-btn-left span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .folder-count {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .folder-btn.active .folder-count {
      color: var(--blue);
    }

    .card-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* Toolbar */
    .toolbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .selected-summary {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .selected-summary.has-selection {
      color: var(--text-primary);
      font-weight: 600;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
      width: 264px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    .input {
      width: 100%;
      height: 40px;
      border-radius: var(--radius-control);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13.5px;
      padding: 0 12px 0 38px;
    }

    .input::placeholder {
      color: var(--text-secondary);
    }

    .filter-chip-count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--bg-page);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn.filter-active {
      border-color: var(--blue);
      color: var(--blue);
      background: var(--blue-soft);
    }

    .btn.filter-active .filter-chip-count {
      background: var(--blue);
      color: #FFFFFF;
    }

    /* Filter Bar (expandable) */
    .filter-bar {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-bar.open {
      display: flex;
    }

    .filter-bar-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-right: 4px;
    }

    .filter-pill {
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-pill:hover {
      border-color: var(--border-strong);
    }

    .filter-pill.active {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: var(--blue);
    }

    /* View Toggle */
    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      padding: 3px;
      background: var(--bg-page);
      height: 40px;
      align-items: center;
    }

    .view-toggle-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .view-toggle-btn.active {
      background: var(--bg-card);
      color: var(--blue);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    /* Checkbox */
    .checkbox {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      accent-color: var(--blue);
      cursor: pointer;
      margin: 0;
    }

    /* List View Table */
    .table-wrap {
      width: 100%;
    }

    .asset-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .asset-table thead th {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .asset-table th.col-check,
    .asset-table td.col-check {
      width: 52px;
      padding-left: 24px;
      padding-right: 8px;
    }

    .asset-table th.col-asset,
    .asset-table td.col-asset {
      width: 40%;
    }

    .asset-table th.col-seo,
    .asset-table td.col-seo {
      width: auto;
    }

    .asset-table th.col-actions,
    .asset-table td.col-actions {
      width: 72px;
      padding-right: 24px;
      text-align: right;
    }

    .asset-row {
      border-bottom: 1px solid var(--border);
      transition: background-color 0.12s;
    }

    .asset-row:last-child {
      border-bottom: none;
    }

    .asset-row:hover {
      background-color: var(--bg-hover);
    }

    .asset-row.selected {
      background-color: var(--bg-selected);
    }

    .asset-row td {
      padding: 14px 16px;
      vertical-align: middle;
    }

    .asset-cell {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .thumb-56 {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-thumb);
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: #0F172A;
    }

    .asset-meta {
      min-width: 0;
    }

    .asset-filename {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .asset-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .seo-cell {
      min-width: 0;
    }

    .seo-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .seo-alt {
      margin-top: 3px;
      font-size: 13px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .alt-label {
      font-weight: 700;
      color: var(--text-primary);
      margin-right: 4px;
    }

    .badge-amber {
      display: inline-flex;
      align-items: center;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--amber-bg);
      color: var(--amber-text);
      border: 1px solid var(--amber-border);
      font-size: 12px;
      font-weight: 600;
    }

    /* Row More Actions */
    .action-menu-wrap {
      position: relative;
      display: inline-flex;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: var(--bg-page);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      width: 176px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      z-index: 30;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      display: none;
    }

    .dropdown-menu.open {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      border: none;
      background: transparent;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dropdown-item:hover {
      background: var(--bg-page);
    }

    .dropdown-item.danger {
      color: var(--red);
    }

    .dropdown-item.danger:hover {
      background: var(--red-hover);
    }

    /* Grid View */
    .grid-wrap {
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, background-color 0.15s;
    }

    .grid-card:hover {
      border-color: var(--border-strong);
    }

    .grid-card.selected {
      border-color: var(--blue);
      background: var(--bg-selected);
    }

    .grid-thumb-box {
      position: relative;
      aspect-ratio: 16 / 10;
      background: #0F172A;
      overflow: hidden;
    }

    .grid-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .grid-check-wrap {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid-hover-details {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      color: #FFFFFF;
      padding: 12px 12px 12px 46px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .grid-card:hover .grid-hover-details,
    .grid-card:focus-within .grid-hover-details {
      opacity: 1;
    }

    .grid-hover-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .grid-hover-alt {
      font-size: 12px;
      color: #CBD5E1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .grid-body {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .grid-meta {
      min-width: 0;
    }

    .grid-filename {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .grid-size {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Empty State */
    .empty-state {
      padding: 64px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--bg-page);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 4px;
    }

    .empty-text {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin: 0 0 20px;
    }

    /* Loading Skeleton */
    .skeleton-list {
      padding: 8px 0;
    }

    .skeleton-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
    }

    .skeleton-row:last-child {
      border-bottom: none;
    }

    .skel-box {
      background: #E9EEF5;
      border-radius: 6px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Footer Pagination */
    .card-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .footer-count {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .per-page-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .select {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      padding: 0 10px;
      cursor: pointer;
    }

    .pagination {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-btn {
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .page-btn:hover:not(:disabled) {
      background: var(--bg-subtle);
    }

    .page-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #FFFFFF;
    }

    .page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Modal for Edit Details / New Folder */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 24px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .field-group {
      margin-bottom: 16px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%;
      height: 40px;
      border-radius: var(--radius-control);
      border: 1px solid var(--border);
      padding: 0 12px;
      font-size: 14px;
      color: var(--text-primary);
    }

    .field-textarea {
      width: 100%;
      min-height: 84px;
      border-radius: var(--radius-control);
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text-primary);
      resize: vertical;
      font-family: inherit;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0F172A;
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      z-index: 60;
      display: none;
    }

    .toast.show {
      display: block;
    }

    /* Discreet State Switcher for Design Review */
    .demo-bar {
      margin-top: 24px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .demo-bar-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
    }

    .demo-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .demo-pill {
      height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .demo-pill:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    /* Mobile Folder Chips (hidden on desktop) */
    .mobile-folders {
      display: none;
    }

    /* Responsive below 1100px */
    @media (max-width: 1100px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 16px;
      }

      .page-content {
        padding: 20px 16px 40px;
      }

      .card-workspace {
        flex-direction: column;
      }

      .folders-panel {
        display: none;
      }

      .mobile-folders {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .mobile-folders::-webkit-scrollbar {
        display: none;
      }

      .mobile-folder-chip {
        height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }

      .mobile-folder-chip.active {
        background: var(--blue-soft);
        border-color: var(--blue);
        color: var(--blue);
      }

      .toolbar {
        padding: 14px 16px;
      }

      .toolbar-left,
      .toolbar-right {
        width: 100%;
      }

      .search-wrap {
        flex: 1;
        width: auto;
        min-width: 160px;
      }

      /* Compact card rows in List view */
      .asset-table thead {
        display: none;
      }

      .asset-table,
      .asset-table tbody,
      .asset-table tr,
      .asset-table td {
        display: block;
        width: 100%;
      }

      .asset-row {
        position: relative;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }

      .asset-row td {
        padding: 0;
      }

      .asset-table th.col-check,
      .asset-table td.col-check {
        position: absolute;
        top: 16px;
        left: 16px;
        width: auto;
        padding: 0;
        z-index: 2;
      }

      .asset-table td.col-asset {
        width: 100%;
        padding-left: 28px;
        padding-right: 44px;
      }

      .asset-table td.col-seo {
        width: 100%;
        margin-top: 10px;
      }

      .asset-table td.col-actions {
        position: absolute;
        top: 12px;
        right: 12px;
        width: auto;
        padding: 0;
      }

      /* Grid view: 2 cards per row */
      .grid-wrap {
        padding: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .card-footer {
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>

        <button class="nav-item" type="button" aria-label="Team" title="Team">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

      </nav>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="breadcrumb" aria-label="Breadcrumb">
          <span>Media</span>
          <span>/</span>
          <span class="breadcrumb-current" id="breadcrumbView">List</span>
        </div>
        <div class="avatar" aria-label="User profile AR">AR</div>
      </header>

      <!-- Page Content -->
      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-title">Media</h1>
            <p class="page-subtitle" id="pageSubtitle">14 assets. Keep titles and alt text complete for SEO and accessibility.</p>
          </div>
          <div class="header-actions">
            <button class="btn" type="button" id="btnNewFolder">New folder</button>
            <button class="btn btn-primary" type="button" id="btnUploadMedia">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

        <!-- Single Main White Card -->

          <!-- Upload Drag-and-Drop Panel -->

              <button class="btn btn-ghost" type="button" id="btnCloseUpload" aria-label="Close upload panel">Close</button>

  <script>
    // Helper: generate crisp dark + lime-green SVG thumbnails matching GetIntoFeed's visual style
    function makeThumb(label, motif) {
      const motifs = {

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function getFolderMatchIds(folderId) {
      if (folderId === 'all') return null;
      const children = state.folders.filter(f => f.parent === folderId).map(f => f.id);
      return new Set([folderId, ...children]);
    }

    function getFilteredAssets() {
      const folderIds = getFolderMatchIds(state.activeFolder);
      const q = state.search.trim().toLowerCase();
      return state.assets.filter(item => {
        if (folderIds && !folderIds.has(item.folder)) return false;
        if (state.filterMissingAlt && item.alt.trim() !== '') return false;
        if (state.filterPngOnly && item.type !== 'PNG') return false;
        if (q && !item.filename.toLowerCase().includes(q) && !item.title.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function countFolderAssets(folderId) {
      const ids = getFolderMatchIds(folderId);
      if (!ids) return state.assets.length;
      return state.assets.filter(a => ids.has(a.folder)).length;
    }

    function renderPagination(total) {
      const totalPages = Math.max(1, Math.ceil(total / state.perPage));
      if (state.page > totalPages) state.page = totalPages;
      const start = total === 0 ? 0 : (state.page - 1) * state.perPage + 1;
      const end = Math.min(total, state.page * state.perPage);
      footerCount.textContent = `Showing ${start} to ${end} of ${total} results`;

      let buttons = '';
      for (let p = 1; p <= totalPages; p++) {
        buttons += `<button class="page-btn ${p === state.page ? 'active' : ''}" type="button" data-page="${p}" aria-label="Page ${p}" ${p === state.page ? 'aria-current="page"' : ''}>${p}</button>`;
      }
      buttons += `
        <button class="page-btn" type="button" data-page="next" aria-label="Next page" ${state.page >= totalPages ? 'disabled' : ''}>
          Next
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      `;
      paginationControls.innerHTML = buttons;

      paginationControls.querySelectorAll('[data-page]').forEach(btn => {
        btn.onclick = () => {
          if (btn.dataset.page === 'next') {
            if (state.page < totalPages) state.page++;
          } else {
            state.page = Number(btn.dataset.page);
          }
          render();
        };
      });
    }

    function bindRowInteractions() {
      document.querySelectorAll('.row-check').forEach(cb => {
        cb.onchange = () => {

          else state.selectedIds.delete(id);
          render();
        };

      document.querySelectorAll('[data-menu-btn]').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const id = Number(btn.dataset.menuBtn);
          state.openMenuId = state.openMenuId === id ? null : id;
          render();
        };
      });

      document.querySelectorAll('[data-action]').forEach(itemBtn => {
        itemBtn.onclick = () => {
          const id = Number(itemBtn.dataset.id);
          const asset = state.assets.find(a => a.id === id);
          state.openMenuId = null;
          if (!asset) return;

          if (itemBtn.dataset.action === 'copy') {
            showToast(`Copied URL for ${asset.filename}`);
          } else if (itemBtn.dataset.action === 'edit') {
            state.editingId = id;
            document.getElementById('editTitleInput').value = asset.title;
            document.getElementById('editAltInput').value = asset.alt;
            document.getElementById('editModal').classList.add('open');
          } else if (itemBtn.dataset.action === 'move') {
            showToast(`Moved ${asset.filename} to folder`);
          } else if (itemBtn.dataset.action === 'delete') {
            state.assets = state.assets.filter(a => a.id !== id);
            state.selectedIds.delete(id);
            showToast(`Deleted ${asset.filename}`);
          }
          render();
        };
      });
    }

    function render() {
      pageSubtitle.textContent = `${state.assets.length} assets. Keep titles and alt text complete for SEO and accessibility.`;
      uploadPanel.classList.toggle('open', state.uploadOpen);

      renderFolders();
      renderToolbar();

      if (state.loading) {
        renderLoading();
        return;
      }

      const filtered = getFilteredAssets();
      if (filtered.length === 0) {
        renderEmpty();
        return;
      }

      cardFooter.style.display = 'flex';
      const totalPages = Math.max(1, Math.ceil(filtered.length / state.perPage));
      if (state.page > totalPages) state.page = totalPages;
      const startIdx = (state.page - 1) * state.perPage;
      const pageItems = filtered.slice(startIdx, startIdx + state.perPage);

      if (state.viewMode === 'list') renderListView(pageItems);
      else renderGridView(pageItems);

      renderPagination(filtered.length);
      bindRowInteractions();
    }

    // Event Listeners
    document.addEventListener('click', () => {
      if (state.openMenuId !== null) {
        state.openMenuId = null;
        render();
      }
    });

    searchInput.addEventListener('input', (e) => {
      state.search = e.target.value;
      state.page = 1;
      render();
    });

    btnFilters.addEventListener('click', () => {
      state.filterOpen = !state.filterOpen;
      render();
    });

    pillMissingAlt.addEventListener('click', () => {
      state.filterMissingAlt = !state.filterMissingAlt;
      state.page = 1;
      render();
    });

    pillPng.addEventListener('click', () => {
      state.filterPngOnly = !state.filterPngOnly;
      state.page = 1;
      render();
    });

    btnViewList.addEventListener('click', () => {
      state.viewMode = 'list';
      render();
    });

    btnViewGrid.addEventListener('click', () => {
      state.viewMode = 'grid';
      render();
    });

    perPageSelect.addEventListener('change', (e) => {
      state.perPage = Number(e.target.value);
      state.page = 1;
      render();
    });

    // Upload panel
    document.getElementById('btnUploadMedia').addEventListener('click', () => {
      state.uploadOpen = !state.uploadOpen;
      if (state.uploadOpen && uploadQueue.children.length === 0) {
        simulateUploadQueue([
          { name: 'meta-ads-creative-framework-2027.png', pct: 72, size: '184.2 KB' },
          { name: 'lead-magnet-landing-wireframe.png', pct: 100, size: '132.0 KB' }
        ]);
      }
      render();
    });

    document.getElementById('btnCloseUpload').addEventListener('click', () => {
      state.uploadOpen = false;
      render();
    });

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files || []).map(f => ({ name: f.name, pct: 65, size: `${(f.size / 1024).toFixed(1)} KB` }));
      if (files.length) simulateUploadQueue(files);
    });
    fileInput.addEventListener('change', () => {
      const files = Array.from(fileInput.files || []).map(f => ({ name: f.name, pct: 65, size: `${(f.size / 1024).toFixed(1)} KB` }));
      if (files.length) simulateUploadQueue(files);
    });

    function simulateUploadQueue(items) {
      uploadQueue.innerHTML = items.map(f => `
        <div class="upload-item">
          <div class="upload-item-info">
            <div class="upload-item-name">
              <span>${f.name}</span>
              <span style="color:var(--text-secondary);font-weight:500;">${f.pct === 100 ? 'Complete' : f.pct + '%'}</span>
            </div>
            <div class="upload-progress-track">
              <div class="upload-progress-bar" style="width:${f.pct}%"></div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Modals
    document.getElementById('btnCancelEdit').onclick = () => document.getElementById('editModal').classList.remove('open');
    document.getElementById('btnSaveEdit').onclick = () => {
      const asset = state.assets.find(a => a.id === state.editingId);
      if (asset) {
        asset.title = document.getElementById('editTitleInput').value.trim() || asset.title;
        asset.alt = document.getElementById('editAltInput').value.trim();
        showToast('Saved media details');
      }
      document.getElementById('editModal').classList.remove('open');
      render();
    };

    const openFolderModal = () => {
      document.getElementById('folderNameInput').value = '';
      document.getElementById('folderModal').classList.add('open');
    };
    document.getElementById('btnNewFolder').onclick = openFolderModal;
    document.getElementById('btnSidebarNewFolder').onclick = openFolderModal;
    document.getElementById('btnCancelFolder').onclick = () => document.getElementById('folderModal').classList.remove('open');
    document.getElementById('btnCreateFolder').onclick = () => {
      const name = document.getElementById('folderNameInput').value.trim();
      if (name) {
        state.folders.push({ id: 'folder-' + Date.now(), name, parent: null });
        showToast(`Created folder "${name}"`);
      }
      document.getElementById('folderModal').classList.remove('open');
      render();
    };

    // Demo State Switcher
    window.setDemoState = function(mode) {
      state.loading = false;
      state.uploadOpen = false;
      state.filterMissingAlt = false;
      state.filterPngOnly = false;
      state.filterOpen = false;
      state.search = '';
      searchInput.value = '';
      state.activeFolder = 'all';
      state.selectedIds.clear();
      state.page = 1;

      if (mode === 'list') {
        state.viewMode = 'list';
      } else if (mode === 'grid') {
        state.viewMode = 'grid';
      } else if (mode === 'selected') {
        state.viewMode = 'list';
        state.selectedIds.add(1);
        state.selectedIds.add(2);
        state.selectedIds.add(3);
      } else if (mode === 'missingAlt') {
        state.viewMode = 'list';
        state.filterOpen = true;
        state.filterMissingAlt = true;
      } else if (mode === 'upload') {
        state.viewMode = 'list';
        state.uploadOpen = true;
        simulateUploadQueue([
          { name: 'meta-ads-creative-framework-2027.png', pct: 72, size: '184.2 KB' },
          { name: 'lead-magnet-landing-wireframe.png', pct: 100, size: '132.0 KB' }
        ]);
      } else if (mode === 'empty') {
        state.viewMode = 'list';
        state.search = 'nonexistent-asset';
        searchInput.value = 'nonexistent-asset';
      } else if (mode === 'loading') {
        state.loading = true;
      }
      render();
    };

    render();
  </script>
</body>
</html>
