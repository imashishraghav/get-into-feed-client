<!DOCTYPE html>

        @font-face {

        .pattern-grid {

            height: 400px;
            background: #D4FF00;
            border-radius: 50%;
            filter: blur(160px);
            opacity: 0.12;
            pointer-events: none;

        .container {

        h1 {

            letter-spacing: -1px;
            line-height: 1.1;
            margin-bottom: 16px;

            color: #9CA3AF;
            font-size: clamp(14px, 2.5vw, 16px);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        .btn-primary {
            background: #D4FF00;
            color: #09090B;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, background-color 0.2s;

        .btn-secondary {

            gap: 8px;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            border-color: #FFFFFF;
        }
        .support-link {
            margin-top: 36px;
            font-size: 13px;
            color: #6B7280;
        }
        .support-link a {
            color: #D4FF00;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
